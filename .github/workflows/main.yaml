name: Build, release, and deploy

on:
  push:
    branches:
      - main
      - "build/*"
      - "chore/*"
      - "ci/*"
      - "docs/*"
      - "feat/*"
      - "fix/*"
      - "perf/*"
      - "refactor/*"
      - "revert/*"
      - "style/*"
      - "test/*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}

jobs:
  build:
    name: Build theme and sample
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          if (-not $env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $version = "1.0.0"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Update release metadata
        shell: pwsh
        run: |
          $theme = Get-Content -LiteralPath "src/theme.json" -Raw | ConvertFrom-Json
          $theme.version = "${{ steps.version.outputs.value }}"
          $theme | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath "src/theme.json"

          $settings = Get-Content -LiteralPath "sample/appsettings.json" -Raw | ConvertFrom-Json
          foreach ($plugin in $settings.Plugins) {
            if ($plugin.Id -eq "google-analytics" -and -not [string]::IsNullOrWhiteSpace($env:GA_MEASUREMENT_ID)) {
              $plugin.Options.MeasurementId = $env:GA_MEASUREMENT_ID
            }
          }
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $settings.Site.BaseUrl = "/minimal-blog/"
            $settings.Site.SiteUrl = "https://getscissorhands.app"
          }
          $settings | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath "sample/appsettings.json"

      - name: Restore packages from NuGet.org
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # Uncomment after adding test projects to the solution.
      # - name: Test solution
      #   run: dotnet test --configuration Release --no-build --no-restore

      - name: Package theme
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          mkdir -p published
          pushd src
          zip -r ../published/minimal-blog-v${{ steps.version.outputs.value }}.zip . \
            -x "bin/*" "obj/*"
          popd

      - name: Upload release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: release-artifact
          path: published

      - name: Generate sample site
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          Push-Location sample
          try {
            dotnet run --configuration Release --no-build -- --build
          }
          finally {
            Pop-Location
          }

      - name: Upload Pages artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: sample/dist

  release:
    name: Create GitHub release
    if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v6
        with:
          name: release-artifact
          path: published

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: published/*.zip
          generate_release_notes: true

  deploy:
    name: Deploy GitHub Pages
    if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
